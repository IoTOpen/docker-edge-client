# Development setup for the edge client.
#
# Builds an image from the published edge-client image (see Dockerfile.dev),
# with:
#   - iotopen-rt built from a local checkout of the iotopen-rt repo
#   - edged and edge-app taken from a local checkout of the edged repo
#   - real credentials from config/iotopen.dev.json (git-ignored)
#   - the local MQTT broker and web GUI reachable from this machine only
#
# Usage:
#   1. Create credentials in IoT Open:
#        Installation -> Settings -> Edge Client -> Create new credentials
#      and save the resulting file as config/iotopen.dev.json
#   2. docker compose -f docker-compose.dev.yml up --build
#   3. After changing edged or iotopen-rt, rebuild: repeat step 2.
#      Verify what is running with:
#        docker compose -f docker-compose.dev.yml exec edge-client edged -v
#      A "-dirty" suffix means the build included uncommitted changes.
#
# The base image must be resolvable by the active buildx builder. A
# docker-container builder always pulls it from ghcr.io; if that fails
# (e.g. stale ghcr.io credentials), use the local image via the default
# builder:
#   BUILDX_BUILDER=default docker compose -f docker-compose.dev.yml up --build
#
# Source locations can be overridden:
#   IOTOPEN_RT_SRC  (default: ../../iotopen-rt)
#   EDGED_SRC       (default: ../../edged)

services:
  edge-client:
    build:
      context: .
      dockerfile: Dockerfile.dev
      additional_contexts:
        iotopen-rt: ${IOTOPEN_RT_SRC:-../../iotopen-rt}
        edged: ${EDGED_SRC:-../../edged}
    image: iotopen/edge-client:dev
    pull_policy: build
    container_name: iotopen-edge-client-dev

    environment:
      # Web GUI without authentication; safe only because the port is
      # bound to localhost below.
      INSECURE: "true"

    volumes:
      # Credentials generated in IoT Open (never commit this file).
      # Fail instead of silently creating an empty directory if missing.
      - type: bind
        source: ./config/iotopen.dev.json
        target: /etc/iot-open/iotopen.json
        read_only: true
        bind:
          create_host_path: false

      # Let the broker listen on all interfaces inside the container
      # (anonymous access; the port is published to localhost only)
      - ./config/mosquitto-local.conf:/etc/mosquitto/conf.d/local.conf:ro

      # Persist downloaded apps and their configs between restarts
      - edge-data:/var/lib/iot-open/edge

    ports:
      - "127.0.0.1:1883:1883"
      - "127.0.0.1:8088:80"

volumes:
  edge-data:
